rules:
  - id: custom-fastapi-hardcoded-jwt-secret
    patterns:
      - pattern-either:
          - pattern: $SECRET = "..."
          - pattern: $SECRET = '...'
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i)(jwt_secret|api_key|secret_key|token)
      - pattern-not: $SECRET = ""
      - pattern-not: $SECRET = "YOUR_SECRET_HERE"
    message: "Detected a hardcoded secret/API key in the code. This is a severe security risk. Use environment variables (e.g., `os.getenv()`) or a secret management service."
    languages:
      - python
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
