name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scans:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies (App & Scanner)
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt
        pip install -r requirements.txt
        pip install safety

    - name: 1. Software Composition Analysis (SCA)
      run: |
        echo "Running safety check for vulnerable dependencies..."
        safety check -r app/requirements.txt || true # Continue on error for demo

    - name: 2. Install Security Tools (Semgrep & Nuclei)
      run: |
        python -m pip install semgrep
        go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
        echo "$HOME/go/bin" >> $GITHUB_PATH

    - name: 3. Start Vulnerable API (Staging Environment)
      run: |
        cd app
        uvicorn main:app --host 127.0.0.1 --port 8000 &
        sleep 5 # Wait for app to start

    - name: 4. Run Custom Security Automation Tool (SAST & DAST)
      run: |
        ./sec_scanner.py
      env:
        TARGET_URL: "http://127.0.0.1:8000"
